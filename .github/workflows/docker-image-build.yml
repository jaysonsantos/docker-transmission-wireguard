name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - README.md
      - docker-compose.yml
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Branch pushes → :main / :dev
      # Semver tags (v1.2.3) → :1.2.3, :1.2, :1, and :latest (via flavor)
      # The Transmission version comes from the base image tag in the
      # Dockerfile, which Renovate updates.
      - name: Read Transmission version
        id: version
        run: echo "transmission=$(sed -n 's#^FROM .*/transmission-base:\([0-9.]*\)-.*#\1#p' Dockerfile)" >> "$GITHUB_OUTPUT"

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/transmission-wireguard
          tags: |
            type=ref,event=branch
            type=raw,value=${{ steps.version.outputs.transmission }},enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=${{ steps.version.outputs.transmission }}-,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: |
            latest=auto

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            REVISION=${{ github.sha }}
          # A pull request only builds, so Renovate automerge waits for it.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ github.workflow }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}
